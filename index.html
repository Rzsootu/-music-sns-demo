<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mood 🎵</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f7f8;padding-bottom:82px}header{background:#fff;padding:15px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900}.sub,.muted{font-size:12px;color:#777}.avatar{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.page{display:none;padding:15px}.page.active{display:block}.card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:15px;margin:10px 0}.hero{background:#111;color:#fff;border-radius:24px;padding:20px}.hero h1{font-size:27px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;background:#eee}.black{background:#111;color:#fff}.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:14px;font-size:15px;margin:6px 0}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}.cover{width:62px;height:62px;border-radius:12px;background:#eee;display:grid;place-items:center;font-size:28px}.song{font-weight:850}.artist{font-size:13px;color:#777;margin-top:4px}.time{font-size:11px;color:#999;margin-top:5px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav{border:0;background:none;font-weight:800;font-size:11px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{width:min(430px,100%);margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:20px;display:none;z-index:30}.story{min-width:62px;text-align:center;font-size:11px}.storyIcon{width:56px;height:56px;border:3px solid #111;border-radius:50%;display:grid;place-items:center;font-size:25px;margin:auto}.likeOn{background:#111;color:#fff}.error{color:#b00020}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header><div><div class="logo">Mood 🎵</div><div class="sub">人を通して、音楽と出会う</div></div><div class="avatar" id="av">?</div></header>
<section id="auth" class="page"><h1>Moodへようこそ</h1><input id="email" class="field" type="email" placeholder="メール"><input id="pass" class="field" type="password" placeholder="パスワード"><input id="uname" class="field" placeholder="ユーザー名（新規登録時）"><button class="btn black" onclick="signup()">新規登録</button> <button class="btn" onclick="login()">ログイン</button><p id="msg" class="muted"></p></section>
<section id="home" class="page"><h3>Stories</h3><div id="stories" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px"></div><div class="hero"><small>今日のMood</small><h1>今の気分を、<br>1曲で残そう。</h1><button class="btn" onclick="openPost()">＋ 今日の1曲を投稿</button></div><h3>Feed</h3><div id="feed"></div></section>
<section id="people" class="page"><h3>ユーザー検索</h3><input id="uq" class="field" placeholder="ユーザー名を検索" oninput="users()"><div id="ulist"></div></section>
<section id="calendar" class="page"><h3>My Music Calendar</h3><div class="card"><div class="row"><button class="btn" onclick="monthMove(-1)">‹</button><b id="monthLabel" class="grow" style="text-align:center"></b><button class="btn" onclick="monthMove(1)">›</button></div><div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px"></div></div></section>
<section id="growth" class="page"><h3>Music Character</h3><div class="card" style="text-align:center"><div id="creature" style="font-size:78px">🌱</div><h2 id="level">Lv.1</h2><div style="height:10px;background:#eee;border-radius:10px;overflow:hidden"><div id="growthBar" style="height:100%;background:#111;width:10%"></div></div><p id="growthText" class="muted"></p></div></section>
<section id="profilePage" class="page"><div class="card" style="text-align:center"><div class="avatar" id="pav" style="width:74px;height:74px;margin:auto">?</div><h2 id="pname"></h2><div><b id="pc">0</b> Posts　<b id="fc">0</b> Followers　<b id="fg">0</b> Following</div></div><button class="btn" onclick="logout()">ログアウト</button><div id="mine"></div></section>
</div>
<nav id="nav" class="bottom hidden"><button class="nav" onclick="go('home')">⌂<br>Feed</button><button class="nav" onclick="go('people')">⌕<br>People</button><button class="nav" onclick="go('calendar')">▦<br>Calendar</button><button class="nav" onclick="go('growth')">◉<br>Character</button><button class="nav" onclick="go('profilePage')">●<br>Profile</button></nav>
<div id="postModal" class="modal"><div class="sheet"><h2>今日の1曲</h2><input id="song" class="field" placeholder="曲名"><input id="artist" class="field" placeholder="アーティスト"><input id="mood" class="field" placeholder="ひとこと"><button class="btn black" onclick="postMood()">投稿</button> <button class="btn" onclick="closePost()">閉じる</button></div></div><div id="toast" class="toast"></div>
<script>
let sb,me,prof,allPosts=[],calDate=new Date();
const SUPABASE_URL='https://oriivnqzxarfxpedlnsx.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9yaWl2bnF6eGFyZnhwZWRsbnN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDU3MDgsImV4cCI6MjEwNTEyMTcwOH0.b-fE0dc4hB-s2DEFq4LE025BRW85BfZKi5xCEQJsQ8c';
const APP_URL='https://rzsootu.github.io/-music-sns-demo/';
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pop(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}
async function ensureProfile(){let r=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();if(r.error)throw r.error;prof=r.data;if(!prof){let n=me.user_metadata?.username||('user_'+me.id.slice(0,8));let x=await sb.from('profiles').insert({id:me.id,username:n,display_name:me.user_metadata?.display_name||n}).select().single();if(x.error)throw x.error;prof=x.data}}
async function boot(){try{sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let r=await sb.auth.getSession();if(r.error)throw r.error;if(!r.data.session){$('nav').classList.add('hidden');show('auth');return}me=r.data.session.user;await ensureProfile();start()}catch(e){$('nav').classList.add('hidden');show('auth');$('msg').textContent=e.message}}
async function signup(){try{let n=$('uname').value.trim();if(n.length<3)throw new Error('ユーザー名は3文字以上にしてね');let r=await sb.auth.signUp({email:$('email').value.trim(),password:$('pass').value,options:{emailRedirectTo:APP_URL,data:{username:n,display_name:n}}});if(r.error)throw r.error;if(!r.data.session){$('msg').textContent='確認メールを開いてからMoodに戻ってログインしてね';return}me=r.data.user;await ensureProfile();start()}catch(e){$('msg').textContent=e.message}}
async function login(){try{$('msg').textContent='ログイン中…';let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(r.error)throw r.error;me=r.data.user;await ensureProfile();$('msg').textContent='';start()}catch(e){$('msg').textContent=e.message}}
function start(){$('nav').classList.remove('hidden');$('av').textContent=(prof?.username||'?').slice(0,2).toUpperCase();go('home')}
function go(id){show(id);if(id==='home')feed();if(id==='people')users();if(id==='profilePage')myprofile();if(id==='calendar')renderCalendar();if(id==='growth')renderGrowth();scrollTo(0,0)}
async function feed(){let r=await sb.from('posts').select('id,user_id,song_title,artist_name,mood_text,created_at').order('created_at',{ascending:false});if(r.error){$('feed').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}allPosts=r.data||[];let ids=[...new Set(allPosts.map(x=>x.user_id))],pm={};if(ids.length){let p=await sb.from('profiles').select('id,username').in('id',ids);(p.data||[]).forEach(x=>pm[x.id]=x)}let lr=await sb.from('likes').select('post_id').eq('user_id',me.id),liked=new Set((lr.data||[]).map(x=>String(x.post_id)));$('feed').innerHTML=allPosts.map(p=>`<div class="card"><div class="row"><div class="cover">🎵</div><div class="grow"><div class="song">${esc(p.song_title||'今日の1曲')}</div><div class="artist">${esc(p.artist_name||'')}</div><div class="time">@${esc(pm[p.user_id]?.username||'user')}</div></div></div><p>${esc(p.mood_text||'')}</p><button class="btn ${liked.has(String(p.id))?'likeOn':''}" onclick="like('${p.id}',this)">${liked.has(String(p.id))?'♥ いいね':'♡ いいね'}</button></div>`).join('')||'<div class="card">まだ投稿なし</div>';renderStories(pm);renderCalendar();renderGrowth()}
function openPost(){$('postModal').style.display='flex'}function closePost(){$('postModal').style.display='none'}
async function postMood(){if(!$('song').value.trim())return pop('曲名を入力して');let r=await sb.from('posts').insert({user_id:me.id,song_title:$('song').value.trim(),artist_name:$('artist').value.trim(),mood_text:$('mood').value.trim()});if(r.error)return pop(r.error.message);$('song').value=$('artist').value=$('mood').value='';closePost();await feed();pop('投稿した！')}
async function like(id,b){let q=await sb.from('likes').select('*').eq('user_id',me.id).eq('post_id',id).maybeSingle();if(q.data){let r=await sb.from('likes').delete().eq('user_id',me.id).eq('post_id',id);if(r.error)return pop(r.error.message);b.textContent='♡ いいね';b.classList.remove('likeOn')}else{let r=await sb.from('likes').insert({user_id:me.id,post_id:id});if(r.error)return pop(r.error.message);b.textContent='♥ いいね';b.classList.add('likeOn')}}
async function users(){if(!me)return;let q=$('uq').value.trim(),req=sb.from('profiles').select('id,username,display_name').neq('id',me.id).limit(30);if(q)req=req.ilike('username','%'+q+'%');let r=await req;if(r.error){$('ulist').innerHTML='<div class="card error">'+esc(r.error.message)+'</div>';return}let f=await sb.from('follows').select('following_id').eq('follower_id',me.id),set=new Set((f.data||[]).map(x=>x.following_id));$('ulist').innerHTML=(r.data||[]).map(u=>`<div class="card row"><div class="avatar">${esc((u.username||'?').slice(0,2).toUpperCase())}</div><div class="grow"><b>@${esc(u.username)}</b><div class="muted">${esc(u.display_name||'')}</div></div><button class="btn ${set.has(u.id)?'':'black'}" onclick="followUser('${u.id}',this)">${set.has(u.id)?'フォロー中':'フォロー'}</button></div>`).join('')||'<div class="card">ユーザーが見つかりません</div>'}
async function followUser(id,b){let q=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',id).maybeSingle();if(q.data){let r=await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id);if(r.error)return pop(r.error.message);b.textContent='フォロー';b.classList.add('black')}else{let r=await sb.from('follows').insert({follower_id:me.id,following_id:id});if(r.error)return pop(r.error.message);b.textContent='フォロー中';b.classList.remove('black')}}
async function myprofile(){let [a,b,c,d]=await Promise.all([sb.from('posts').select('*',{count:'exact',head:true}).eq('user_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id),sb.from('posts').select('*').eq('user_id',me.id).order('created_at',{ascending:false})]);$('pname').textContent=prof.display_name||prof.username;$('pav').textContent=(prof.username||'?').slice(0,2).toUpperCase();$('pc').textContent=a.count||0;$('fc').textContent=b.count||0;$('fg').textContent=c.count||0;$('mine').innerHTML=(d.data||[]).map(p=>`<div class="card"><b>${esc(p.song_title||'')}</b><div class="artist">${esc(p.artist_name||'')}</div><p>${esc(p.mood_text||'')}</p></div>`).join('')||'<div class="card">まだ投稿なし</div>'}
function renderStories(pm){let seen=new Set(),ps=allPosts.filter(p=>{if(seen.has(p.user_id))return false;seen.add(p.user_id);return true});$('stories').innerHTML=ps.slice(0,10).map(p=>`<div class="story"><div class="storyIcon">🎵</div>@${esc(pm[p.user_id]?.username||'user')}</div>`).join('')||'<span class="muted">投稿が増えると表示されるよ</span>'}
function monthMove(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderCalendar(){if(!me)return;let y=calDate.getFullYear(),m=calDate.getMonth();$('monthLabel').textContent=`${y}年${m+1}月`;let mine=allPosts.filter(p=>p.user_id===me.id),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),h='';['日','月','火','水','木','金','土'].forEach(x=>h+=`<div class="muted" style="text-align:center">${x}</div>`);for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){let hit=mine.some(p=>{let x=new Date(p.created_at);return x.getFullYear()==y&&x.getMonth()==m&&x.getDate()==d});h+=`<div style="aspect-ratio:1;background:#eee;border-radius:10px;display:grid;place-items:center;font-size:12px">${hit?'🎵 ':''}${d}</div>`}$('calendarGrid').innerHTML=h}
function renderGrowth(){let n=allPosts.filter(p=>p.user_id===me?.id).length,lv=n<2?1:n<5?2:n<10?3:n<20?4:5,ic=['','🌱','🌿','🌳','🌲','🪐'];$('creature').textContent=ic[lv];$('level').textContent='Lv.'+lv;$('growthBar').style.width=Math.min(100,15+n*8)+'%';$('growthText').textContent=`累計 ${n} 投稿`}
async function logout(){await sb.auth.signOut();location.reload()}
boot();
</script></body></html>
