<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><title>Mood 🎵</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f7f8;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px 18px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.logo{font-weight:900;font-size:25px}.sub{font-size:11px;color:#888}.avatar{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.page{display:none;padding:15px}.page.active{display:block}.title{font-size:18px;font-weight:900;margin:6px 0 12px}.card{background:#fff;border:1px solid #e8e8e8;border-radius:21px;padding:15px;margin:10px 0}.row{display:flex;gap:12px;align-items:center}.cover{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#ddd,#888);display:grid;place-items:center;font-size:29px}.meta{flex:1}.song{font-weight:850}.artist{color:#777;font-size:13px;margin-top:4px}.time{color:#999;font-size:11px;margin-top:5px}.mood{font-size:13px;margin-top:12px}.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:800;background:#eee}.black{background:#111;color:#fff}.actions{display:flex;gap:7px;margin-top:12px}
.hero{background:#111;color:#fff;border-radius:24px;padding:20px;margin-bottom:15px}.hero h1{font-size:27px;line-height:1.1;margin:7px 0 15px}.stories{display:flex;gap:13px;overflow-x:auto;padding-bottom:12px}.story{text-align:center;min-width:62px;font-size:11px}.ring{width:58px;height:58px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#111,#999);margin:auto auto 5px}.inner{height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;border:2px solid #fff}
.calendar{background:#fff;border:1px solid #eee;border-radius:21px;padding:16px}.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:#999;font-size:10px}.day{aspect-ratio:1;border-radius:10px;background:#f0f0f0;display:grid;place-items:center;font-size:20px;position:relative}.day span{position:absolute;bottom:2px;right:3px;background:#fffc;border-radius:5px;padding:1px 3px;font-size:8px}.today{outline:2px solid #111}
.grow{display:flex;align-items:center;gap:15px}.creature{font-size:70px}.meter{height:9px;background:#eee;border-radius:20px;overflow:hidden;margin:9px 0}.meter div{height:100%;background:#111}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:14px;font-size:15px}.result{display:flex;gap:11px;align-items:center;background:#fff;padding:11px;border-bottom:1px solid #eee}.mini{width:46px;height:46px;border-radius:9px;background:#ddd;display:grid;place-items:center;font-size:22px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:10}.nav{border:0;background:none;font-size:11px;color:#777;font-weight:800}.nav b{display:block;font-size:22px}.nav.active{color:#111}.fab{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:8;width:58px;height:58px;border-radius:50%;border:0;background:#111;color:#fff;font-size:27px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{width:min(430px,100%);margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px;max-height:80vh;overflow:auto}.close{float:right;border:0;background:#eee;border-radius:50%;width:34px;height:34px}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 17px;border-radius:20px;display:none;z-index:30}
</style></head><body><div class="app">
<header><div><div class="logo">Mood 🎵</div><div class="sub">人を通して、音楽と出会う</div></div><div class="avatar">RY</div></header>

<section id="home" class="page active"><div class="title">Stories</div><div class="stories" id="stories"></div>
<section class="hero"><small>今日のMood</small><h1>今の気分を、<br>1曲で残そう。</h1><button class="btn" onclick="openSearch()">＋ 今日の1曲を投稿</button></section>
<div class="title">Feed</div><div id="posts"></div></section>

<section id="calendar" class="page"><div class="title">My Music Calendar</div><div class="calendar"><div class="calhead"><button class="btn" onclick="chg(-1)">‹</button><b id="month"></b><button class="btn" onclick="chg(1)">›</button></div><div class="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div><div class="days" id="days"></div></div><div class="card"><b>音楽の日記</b><div style="color:#777;font-size:13px;margin-top:6px">投稿した日のジャケットをカレンダーで振り返る。</div></div></section>

<section id="growth" class="page"><div class="title">Music Character</div><div class="card"><div class="grow"><div class="creature" id="creature">🌱</div><div style="flex:1"><b id="level"></b><div class="meter"><div id="bar"></div></div><small id="streak" style="color:#777"></small></div></div></div><div class="card"><b>連続投稿ボーナス</b><p style="color:#666;font-size:13px;line-height:1.6">毎日投稿すると音楽のキャラクターが成長する。投稿を続けるほど姿も変化。</p><button class="btn black" onclick="growth+=2;renderGrowth();toast('✨ キャラクターが成長した！')">今日も投稿する</button></div><div class="card"><b>成長イメージ</b><div style="display:flex;justify-content:space-around;font-size:34px;margin-top:15px">🌱　🌿　🌳　🌲　🪐</div></div></section>

<section id="profile" class="page"><div class="card" style="text-align:center"><div style="width:74px;height:74px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;margin:auto;font-size:24px;font-weight:900">RY</div><h2 style="margin:10px 0 2px">Ryuki</h2><div style="color:#777;font-size:13px">今日の気分を音楽で残す</div><div style="display:flex;justify-content:center;gap:30px;margin-top:15px"><div><b>12</b><small style="display:block;color:#888">Posts</small></div><div><b>128</b><small style="display:block;color:#888">Followers</small></div><div><b>96</b><small style="display:block;color:#888">Following</small></div></div></div><div class="title">最近の曲</div><div id="mySongs"></div></section>
</div>
<button class="fab" onclick="openSearch()">＋</button><nav class="bottom"><button class="nav active" onclick="go('home',this)"><b>⌂</b>Feed</button><button class="nav" onclick="go('calendar',this)"><b>▦</b>Calendar</button><button class="nav" onclick="go('growth',this)"><b>◉</b>Character</button><button class="nav" onclick="go('profile',this)"><b>●</b>Profile</button></nav>
<div class="modal" id="searchModal"><div class="sheet"><button class="close" onclick="closeSearch()">×</button><h2>今日の1曲</h2><p style="color:#777;font-size:13px">曲名・アーティスト名を入力</p><input class="search" id="q" placeholder="例：青と夏" oninput="searchSongs()"><div id="results"></div></div></div>
<div class="modal" id="storyModal"><div class="sheet"><button class="close" onclick="closeStory()">×</button><div id="story"></div></div></div><div class="toast" id="toast"></div>
<script>
const songs=[["青と夏","Mrs. GREEN APPLE","🌻"],["ライラック","Mrs. GREEN APPLE","🪻"],["怪獣の花唄","Vaundy","🦖"],["水平線","back number","🌊"],["高嶺の花子さん","back number","🌸"],["アイドル","YOASOBI","⭐"],["群青","YOASOBI","💙"],["愛をこめて花束を","Superfly","💐"]];
let posts=[["Saki","ライラック","Mrs. GREEN APPLE","🪻","なんか前向きになれる。","2時間前"],["Kenta","水平線","back number","🌊","帰り道に聴いてる。","4時間前"],["RY","怪獣の花唄","Vaundy","🦖","今日はこれ。","昨日"]],growth=7,cal=new Date(2026,8,15);
function render(){posts.forEach(()=>{});document.getElementById("posts").innerHTML=posts.map(p=>`<div class="card"><div class="row"><div class="cover">${p[3]}</div><div class="meta"><div class="song">${p[1]}</div><div class="artist">${p[2]}</div><div class="time">@${p[0]} · ${p[5]}</div></div></div><div class="mood">${p[4]}</div><div class="actions"><button class="btn" onclick="this.textContent=this.textContent.includes('♡')?'♥ いいね':'♡ いいね'">♡ いいね</button><button class="btn" onclick="toast('🎧 試聴を再生する想定')">▶ 試聴</button></div></div>`).join("");document.getElementById("stories").innerHTML=[["Saki","🪻"],["Kenta","🌊"],["Mika","⭐"],["Daiki","🎸"],["Aoi","🌸"],["RY","🦖"]].map(u=>`<div class="story" onclick='openStory(${JSON.stringify(u)})'><div class="ring"><div class="inner">${u[1]}</div></div>${u[0]}</div>`).join("");renderCal();renderGrowth();document.getElementById("mySongs").innerHTML=posts.filter(p=>p[0]=="RY").map(p=>`<div class="card"><div class="row"><div class="cover">${p[3]}</div><div><b>${p[1]}</b><div class="artist">${p[2]}</div></div></div></div>`).join("")}
function openSearch(){document.getElementById("searchModal").style.display="flex";document.getElementById("q").focus();searchSongs()}function closeSearch(){document.getElementById("searchModal").style.display="none"}
function searchSongs(){let raw=document.getElementById("q").value.trim().toLowerCase(),list=songs.filter(s=>(s[0]+s[1]).toLowerCase().includes(raw)),out=list.map(s=>`<div class="result" onclick='selectSong(${JSON.stringify(s)})'><div class="mini">${s[2]}</div><div><b>${s[0]}</b><div class="artist">${s[1]}</div></div></div>`).join("");if(raw)out+=`<div class="result" onclick='selectTyped(${JSON.stringify(document.getElementById("q").value.trim())})'><div class="mini">🎵</div><div><b>「${esc(document.getElementById("q").value.trim())}」を投稿</b><div class="artist">入力した曲名を使う</div></div></div>`;document.getElementById("results").innerHTML=out||"<p style='color:#777;padding:10px'>曲名を入力してください</p>"}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectSong(s){closeSearch();posts.unshift(["RY",s[0],s[1],s[2],"今の気分。","たった今"]);growth++;render();toast("🎵 投稿した！")}function selectTyped(t){selectSong([t,"","🎵"])}
function go(id,b){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));b.classList.add("active");scrollTo(0,0)}
function renderGrowth(){let lv=growth<5?1:growth<10?2:growth<18?3:growth<25?4:5,ic=["","🌱","🌿","🌳","🌲","🪐"],nm=["","はじまり","芽吹き","成長中","音楽好き","Moodの化身"];document.getElementById("creature").textContent=ic[lv];document.getElementById("level").textContent=`Lv.${lv} — ${nm[lv]}`;document.getElementById("bar").style.width=Math.min(100,(growth%6)/6*100+15)+"%";document.getElementById("streak").textContent=`連続投稿 ${growth}日目（デモ）`}
function renderCal(){let y=cal.getFullYear(),m=cal.getMonth();document.getElementById("month").textContent=`${y}年${m+1}月`;let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),o="";for(let i=0;i<first;i++)o+="<div></div>";for(let d=1;d<=last;d++){let p=posts[(d-1)%posts.length];o+=`<div class="day ${d==15&&m==8&&y==2026?'today':''}">${p[3]}<span>${d}</span></div>`}document.getElementById("days").innerHTML=o}
function chg(n){cal.setMonth(cal.getMonth()+n);renderCal()}function openStory(u){document.getElementById("story").innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:80px">${u[1]}</div><h2>${u[0]}のMusic Story</h2><div class="card" style="text-align:left"><b>${u[0]=="Saki"?"ライラック":u[0]=="Kenta"?"水平線":"今日の1曲"}</b><div class="artist">今日の気分 · 今夜</div><button class="btn black" style="margin-top:12px" onclick="toast('🎧 試聴を再生する想定')">▶ 試聴</button></div></div>`;document.getElementById("storyModal").style.display="flex"}function closeStory(){document.getElementById("storyModal").style.display="none"}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}
render();
</script></body></html>
