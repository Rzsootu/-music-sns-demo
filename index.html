<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mood 🎵</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;color:#111}.app{max-width:430px;min-height:100vh;margin:auto;background:#f7f7f8;padding-bottom:80px}header{background:#fff;padding:15px 18px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.logo{font-size:25px;font-weight:900}.sub,.muted{font-size:12px;color:#777}.avatar{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.page{display:none;padding:15px}.page.active{display:block}.card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:15px;margin:10px 0}.hero{background:#111;color:#fff;border-radius:24px;padding:20px}.hero h1{font-size:27px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;background:#eee}.black{background:#111;color:#fff}.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:14px;font-size:15px;margin:6px 0}.row{display:flex;gap:12px;align-items:center}.grow{flex:1}.cover{width:62px;height:62px;border-radius:12px;background:#eee;display:grid;place-items:center;font-size:28px}.song{font-weight:850}.artist{font-size:13px;color:#777;margin-top:4px}.time{font-size:11px;color:#999;margin-top:5px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center}.nav{border:0;background:none;font-weight:800}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{width:min(430px,100%);margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#111;color:white;padding:11px 16px;border-radius:20px;display:none;z-index:30}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><div class="app"><header><div><div class="logo">Mood 🎵</div><div class="sub">人を通して、音楽と出会う</div></div><div class="avatar" id="av">?</div></header>
<section id="setup" class="page active"><h1>Supabase接続</h1><p class="muted">最初の1回だけ。Project URL と Publishable key を入力。</p><input id="url" class="field" placeholder="https://xxxxx.supabase.co"><input id="key" class="field" placeholder="sb_publishable_..."><button class="btn black" onclick="saveSetup()">保存</button><p class="muted">Secret key / service_role key は入れないでください。</p></section>
<section id="auth" class="page"><h1>Moodへようこそ</h1><input id="email" class="field" type="email" placeholder="メール"><input id="pass" class="field" type="password" placeholder="パスワード"><input id="uname" class="field" placeholder="ユーザー名（新規登録時）"><button class="btn black" onclick="signup()">新規登録</button> <button class="btn" onclick="login()">ログイン</button><p id="msg" class="muted"></p></section>
<section id="home" class="page"><h3>Stories</h3><div id="stories" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:12px"></div><div class="hero"><small>今日のMood</small><h1>今の気分を、<br>1曲で残そう。</h1><button class="btn" onclick="openPost()">＋ 今日の1曲を投稿</button></div><h3>Feed</h3><div id="feed"></div></section>
<section id="people" class="page"><h3>ユーザー検索</h3><input id="uq" class="field" placeholder="ユーザー名" oninput="users()"><div id="ulist"></div></section>
<section id="calendar" class="page"><h3>My Music Calendar</h3><div class="card"><div class="row"><button class="btn" onclick="monthMove(-1)">‹</button><b id="monthLabel" class="grow" style="text-align:center"></b><button class="btn" onclick="monthMove(1)">›</button></div><div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px"></div></div></section>
<section id="growth" class="page"><h3>Music Character</h3><div class="card" style="text-align:center"><div id="creature" style="font-size:78px">🌱</div><h2 id="level">Lv.1</h2><div style="height:10px;background:#eee;border-radius:10px;overflow:hidden"><div id="growthBar" style="height:100%;background:#111;width:10%"></div></div><p id="growthText" class="muted"></p></div></section>
<section id="profile" class="page"><div class="card" style="text-align:center"><div class="avatar" id="pav" style="width:74px;height:74px;margin:auto">?</div><h2 id="pname"></h2><div><b id="pc">0</b> Posts　<b id="fc">0</b> Followers　<b id="fg">0</b> Following</div></div><button class="btn" onclick="logout()">ログアウト</button><div id="mine"></div></section>
</div>
<nav id="nav" class="bottom hidden"><button class="nav" onclick="go('home')">⌂<br>Feed</button><button class="nav" onclick="go('people')">⌕<br>People</button><button class="nav" onclick="go('calendar')">▦<br>Calendar</button><button class="nav" onclick="go('growth')">◉<br>Character</button><button class="nav" onclick="go('profile')">●<br>Profile</button></nav>
<div id="postModal" class="modal"><div class="sheet"><h2>今日の1曲</h2><input id="song" class="field" placeholder="曲名"><input id="artist" class="field" placeholder="アーティスト"><input id="mood" class="field" placeholder="ひとこと"><button class="btn black" onclick="post()">投稿</button> <button class="btn" onclick="closePost()">閉じる</button></div></div><div id="toast" class="toast"></div>
<script>
let sb,me,prof;
const U='mood_url',K='mood_key';
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function saveSetup(){localStorage.setItem(U,url.value.trim());localStorage.setItem(K,key.value.trim());location.reload()}
async function boot(){let u=localStorage.getItem(U),k=localStorage.getItem(K);if(!u||!k)return;sb=supabase.createClient(u,k);let {data:{session}}=await sb.auth.getSession();if(!session){show('auth');return}me=session.user;await profile();start()}
async function signup(){let {data,error}=await sb.auth.signUp({email:email.value.trim(),password:pass.value,options:{data:{username:uname.value.trim()}}});if(error)return msg.textContent=error.message;if(!data.session)return msg.textContent='確認メールを確認してからログインして。';me=data.user;await profile();start()}
async function login(){let {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(error)return msg.textContent=error.message;me=data.user;await profile();start()}
async function profile(){let r=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();prof=r.data;if(!prof){let n=me.user_metadata?.username||('user_'+me.id.slice(0,6));let x=await sb.from('profiles').insert({id:me.id,username:n,display_name:n}).select().single();prof=x.data}}
function start(){nav.classList.remove('hidden');av.textContent=(prof.username||'?').slice(0,2).toUpperCase();go('home')}
function go(id){show(id);if(id==='home')feed();if(id==='profile')myprofile();if(id==='calendar')renderCalendar();if(id==='growth')renderGrowth();scrollTo(0,0)}
async function feed(){let {data,error}=await sb.from('posts').select('id,user_id,song_title,artist_name,mood_text,created_at').order('created_at',{ascending:false});if(error)return feedEl(error.message);let ps=data||[],ids=[...new Set(ps.map(x=>x.user_id))],pm={};if(ids.length){let r=await sb.from('profiles').select('id,username').in('id',ids);(r.data||[]).forEach(x=>pm[x.id]=x)}window._posts=ps;document.getElementById('feed').innerHTML=ps.map(p=>`<div class="card"><div class="row"><div class="cover">🎵</div><div class="grow"><div class="song">${esc(p.song_title||'今日の1曲')}</div><div class="artist">${esc(p.artist_name||'')}</div><div class="time">@${esc(pm[p.user_id]?.username||'user')}</div></div></div><p>${esc(p.mood_text||'')}</p><button class="btn" onclick="like('${p.id}',this)">♡ いいね</button></div>`).join('')||'<div class="card">まだ投稿なし</div>';renderStories(ps,pm);renderCalendar();renderGrowth()}
function feedEl(t){document.getElementById('feed').innerHTML='<div class="card">'+esc(t)+'</div>'}
function openPost(){postModal.style.display='flex'}function closePost(){postModal.style.display='none'}
async function post(){if(!song.value.trim())return pop('曲名を入力して');let {error}=await sb.from('posts').insert({user_id:me.id,song_title:song.value.trim(),artist_name:artist.value.trim(),mood_text:mood.value.trim()});if(error)return pop(error.message);song.value=artist.value=mood.value='';closePost();feed();pop('投稿した！')}
async function like(id,b){let q=await sb.from('likes').select('*').eq('user_id',me.id).eq('post_id',id).maybeSingle();if(q.data){await sb.from('likes').delete().eq('user_id',me.id).eq('post_id',id);b.textContent='♡ いいね'}else{let r=await sb.from('likes').insert({user_id:me.id,post_id:id});if(!r.error)b.textContent='♥ いいね'}}
async function users(){let q=uq.value.trim();if(!q)return ulist.innerHTML='';let {data}=await sb.from('profiles').select('id,username,display_name').ilike('username','%'+q+'%').neq('id',me.id).limit(20);ulist.innerHTML=(data||[]).map(u=>`<div class="card row"><div class="avatar">${esc((u.username||'?').slice(0,2).toUpperCase())}</div><div class="grow"><b>@${esc(u.username)}</b></div><button class="btn black" onclick="follow('${u.id}',this)">フォロー</button></div>`).join('')}
async function follow(id,b){let q=await sb.from('follows').select('*').eq('follower_id',me.id).eq('following_id',id).maybeSingle();if(q.data){await sb.from('follows').delete().eq('follower_id',me.id).eq('following_id',id);b.textContent='フォロー'}else{let r=await sb.from('follows').insert({follower_id:me.id,following_id:id});if(!r.error)b.textContent='フォロー中'}}
async function myprofile(){let [a,b,c,d]=await Promise.all([sb.from('posts').select('*',{count:'exact',head:true}).eq('user_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('following_id',me.id),sb.from('follows').select('*',{count:'exact',head:true}).eq('follower_id',me.id),sb.from('posts').select('*').eq('user_id',me.id).order('created_at',{ascending:false})]);pname.textContent=prof.display_name||prof.username;pav.textContent=(prof.username||'?').slice(0,2).toUpperCase();pc.textContent=a.count||0;fc.textContent=b.count||0;fg.textContent=c.count||0;mine.innerHTML=(d.data||[]).map(p=>`<div class="card"><b>${esc(p.song_title)}</b><div class="artist">${esc(p.artist_name||'')}</div></div>`).join('')}
let calDate=new Date();
function renderStories(ps=[],pm={}){let e=document.getElementById('stories');if(e)e.innerHTML=ps.slice(0,10).map(p=>`<div style="min-width:62px;text-align:center;font-size:11px"><div style="width:56px;height:56px;border:3px solid #111;border-radius:50%;display:grid;place-items:center;font-size:25px;margin:auto">🎵</div>@${esc(pm[p.user_id]?.username||'user')}</div>`).join('')||'<span class="muted">投稿が増えると表示されるよ</span>'}
function monthMove(n){calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function renderCalendar(){let e=document.getElementById('calendarGrid');if(!e||!me)return;let y=calDate.getFullYear(),m=calDate.getMonth();monthLabel.textContent=`${y}年${m+1}月`;let mine=(window._posts||[]).filter(p=>p.user_id===me.id),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),h='';['日','月','火','水','木','金','土'].forEach(x=>h+=`<div class="muted" style="text-align:center">${x}</div>`);for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=last;d++){let hit=mine.some(p=>{let x=new Date(p.created_at);return x.getFullYear()==y&&x.getMonth()==m&&x.getDate()==d});h+=`<div style="aspect-ratio:1;background:#f0f0f0;border-radius:10px;display:grid;place-items:center;font-size:12px">${hit?'🎵 ':''}${d}</div>`}e.innerHTML=h}
function renderGrowth(){let n=(window._posts||[]).filter(p=>p.user_id===me?.id).length,lv=n<2?1:n<5?2:n<10?3:n<20?4:5,ic=['','🌱','🌿','🌳','🌲','🪐'];if(document.getElementById('creature')){creature.textContent=ic[lv];level.textContent='Lv.'+lv;growthBar.style.width=Math.min(100,15+n*8)+'%';growthText.textContent=`累計 ${n} 投稿`}}

async function logout(){await sb.auth.signOut();location.reload()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pop(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2000)}
boot();
</script></body></html>
